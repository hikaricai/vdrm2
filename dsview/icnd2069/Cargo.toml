[package]
name = "icnd2069-decode"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Decode ICND2069 commands and RGB serial data from DSView logic captures"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
