[package]
name = "icnd2069-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.4", features = ["rp235xa", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-time = "0.4"
embassy-futures = "0.1"
fixed = "1.23"
static_cell = "2.1"
rtt-target = "0.6.1"
panic-rtt-target = "0.2"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = 3
overflow-checks = true

[profile.dev]
opt-level = 2
